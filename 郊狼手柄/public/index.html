<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>郊狼手柄 · coyote-hand</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d1017;
        --panel: #161b26;
        --line: #263044;
        --text: #e8edf7;
        --muted: #8b97ad;
        --accent: #ff5c8a;
        --accent2: #4dc9ff;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(1200px 600px at 50% -10%, #1b2336, var(--bg));
        color: var(--text);
        font: 14px/1.6 "Segoe UI", system-ui, sans-serif;
        display: flex;
        justify-content: center;
        padding: 28px 16px 60px;
      }
      main { width: min(760px, 100%); display: grid; gap: 16px; }
      h1 { font-size: 20px; margin: 0; letter-spacing: 1px; }
      h1 small { color: var(--muted); font-weight: 400; letter-spacing: 0; }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px;
        display: grid;
        gap: 12px;
      }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .pill {
        font-size: 12px;
        padding: 3px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
      }
      .pill.on { color: #8affc1; border-color: #2f6b4d; background: #10261b; }
      .pill.warn { color: #ffd39a; border-color: #6b552f; background: #261f10; }
      button {
        font: inherit;
        color: var(--text);
        background: #202838;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 14px;
        cursor: pointer;
      }
      button:hover { border-color: #3c4a66; }
      button.primary { background: linear-gradient(135deg, #ff5c8a, #b34dff); border-color: transparent; }
      button.danger { background: #3a1220; border-color: #7d2942; color: #ffb3c6; }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      .channel { display: grid; gap: 8px; }
      .channel header { display: flex; justify-content: space-between; color: var(--muted); }
      .channel strong { color: var(--text); font-size: 16px; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      select {
        font: inherit;
        color: var(--text);
        background: #202838;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 10px;
        min-width: 180px;
      }
      img.qr { width: 240px; height: 240px; image-rendering: pixelated; border-radius: 12px; background: #fff; }
      pre {
        margin: 0;
        padding: 10px;
        background: #0b0f16;
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: auto;
        font-size: 12px;
        color: #9fb0c9;
        max-height: 160px;
      }
      .hint { color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <h1>郊狼手柄 <small>coyote-hand · 只做执行</small></h1>

      <section class="card">
        <div class="row" id="status"></div>
        <div class="row">
          <button id="connect-v4">连接 v4 中继</button>
          <button id="connect-sim">模拟设备</button>
          <button id="disconnect">断开</button>
          <button id="stop" class="danger">紧急停止</button>
        </div>
        <div class="row" id="pairing" hidden>
          <img id="qr" class="qr" alt="配对二维码" />
          <div>
            <p class="hint">用郊狼 APP 扫码配对，选好设备后会自动接管。</p>
            <code id="pairing-url" class="hint"></code>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="channel">
          <header><span>通道 A</span><strong id="value-A">0</strong></header>
          <input id="slider-A" type="range" min="0" max="60" step="1" value="0" />
          <div class="row">
            <select id="wave-A" data-channel="A"><option value="">无波形</option></select>
          </div>
        </div>
        <div class="channel">
          <header><span>通道 B</span><strong id="value-B">0</strong></header>
          <input id="slider-B" type="range" min="0" max="60" step="1" value="0" />
          <div class="row">
            <select id="wave-B" data-channel="B"><option value="">无波形</option></select>
          </div>
        </div>
        <p class="hint" id="guard"></p>
      </section>

      <section class="card">
        <div class="row">
          <span class="hint">最近响应</span>
        </div>
        <pre id="log"></pre>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
